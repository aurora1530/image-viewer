<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ローカル画像ビューワー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

</head>
<body class="mono-body">

    <div id="main-content" class="frame">
        <div class="panel">
            <div class="panel-top">
                <div class="dir-chip">
                    <span class="chip-label">現在のフォルダ</span>
                    <span id="current-dir-name" class="chip-value">フォルダを選択してください</span>
                </div>
                <div class="actions">
                    <button id="up-dir-btn" class="ui-btn ghost hidden">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10.707 4.293a1 1 0 010 1.414L7.414 9H14a1 1 0 110 2H7.414l3.293 3.293a1 1 0 01-1.414 1.414l-5-5a1 1 0 010-1.414l5-5a1 1 0 011.414 0z" clip-rule="evenodd" /></svg>
                        上の階層へ
                    </button>
                    <button id="copy-path-btn" class="ui-btn ghost hidden">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path d="M8 3a1 1 0 011-1h2a1 1 0 110 2H9a1 1 0 01-1-1z" /><path d="M6 3a2 2 0 00-2 2v11a2 2 0 002 2h8a2 2 0 002-2V5a2 2 0 00-2-2 3 3 0 01-3 3H9a3 3 0 01-3-3z" /></svg>
                        パスをコピー
                    </button>
                    <button id="select-dir-btn" class="ui-btn primary">
                        ルートフォルダを選択
                    </button>
                </div>
            </div>
            <div id="status-area" class="status"></div>
            <div id="item-list" class="grid contact-sheet"></div>
        </div>

        <!-- 一覧表示用ツールバー -->
        <div id="list-toolbar" class="dock hidden">
            <div class="dock-inner">
                <select id="size-select" class="ui-select"></select>
                <select id="filter-select" class="ui-select">
                    <option value="all">すべて</option>
                    <option value="directory">ディレクトリ</option>
                    <option value="image">画像</option>
                    <option value="gif">GIF</option>
                    <option value="video">動画</option>
                </select>
                <button id="favorite-first-btn" class="ui-btn ghost">お気に入り優先: OFF</button>
                <button id="favorite-only-btn" class="ui-btn ghost">お気に入りのみ: OFF</button>
                <input id="search-input" type="text" placeholder="検索" class="ui-input" />
                <button id="toggle-sort-btn" class="ui-btn ghost"></button>
                <button id="reload-btn" class="ui-btn ghost">再読み込み</button>
                <button id="recursive-btn" class="ui-btn outline">全画像一覧</button>
            </div>
        </div>
    </div>

    <!-- ビューワー -->
    <div id="viewer">
        <!-- 画像ビューワー -->
        <div id="viewer-pages">
            <div class="page-container">
                <img id="left-page" src="" alt="Left Page" decoding="async">
            </div>
            <div class="page-container">
                <img id="right-page" src="" alt="Right Page" decoding="async">
            </div>
        </div>
        <!-- 動画プレーヤー -->
        <div id="viewer-video-container" class="w-full h-full flex items-center justify-center p-4 hidden">
            <video id="viewer-video" class="max-w-full max-h-full" controls></video>
        </div>

        <div id="viewer-toolbar">
            <button id="prev-btn" class="ui-btn ghost">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
            </button>
            <button id="toggle-view-btn" class="ui-btn ghost w-32">単一表示にする</button>
            <button id="adjust-spread-btn" class="ui-btn ghost">見開き調整</button>
            <span id="page-counter" class="page-counter"></span>
            <button id="next-btn" class="ui-btn ghost">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
            </button>
            <button id="fullscreen-btn" class="ui-btn ghost">全画面</button>
            <button id="copy-image-path-btn" class="ui-btn ghost">パスをコピー</button>
            <button id="close-viewer-btn" class="ui-btn primary">閉じる</button>
        </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ローカル画像ビューワー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* スクロールバーのスタイル */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1f2937;
        }
        ::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }
        /* サムネイルのコンテナ */
        .thumbnail-container {
            aspect-ratio: 3 / 4;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-color: #374151;
            position: relative; /* ボタンを配置するため */
        }
        .thumbnail-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* ディレクトリカード内の「開く」ボタン */
        .read-button {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(30, 41, 59, 0.8);
            color: white;
            padding: 6px 12px;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.3);
            opacity: 0;
            transition: opacity 0.2s ease-in-out;
            pointer-events: none;
        }
        .group:hover .read-button {
            opacity: 1;
            pointer-events: auto;
        }
        /* ビューワーのスタイル */
        #viewer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }
        #viewer-pages {
            display: flex;
            width: 100%;
            height: calc(100% - 80px);
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .page-container {
            width: 48%;
            height: 100%;
            max-width: 90vh;
        }
        .page-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
        }
        /* --- 全画面表示の時だけ適用されるスタイル --- */
        html:fullscreen #viewer {
            background-color: #000;
        }
        html:fullscreen #viewer-pages {
            height: 100%;
            gap: 0;
        }
        html:fullscreen .page-container {
            width: 50%;
            max-width: none;
        }
        html:fullscreen .page-container img {
            object-fit: cover;
        }
        /* --- 全画面スタイルここまで --- */
        #viewer-toolbar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background-color: rgba(17, 24, 39, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            z-index: 60;
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
        }
        html:fullscreen #viewer-toolbar.hidden {
            opacity: 0;
            transform: translateY(100%);
            pointer-events: none;
        }
        /* スピナー */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-200">

    <div id="main-content" class="container mx-auto p-4 md:p-8">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-white mb-2">ローカル画像ビューワー</h1>
            <p class="text-gray-400">ローカルのフォルダから画像を高速で閲覧します。</p>
        </header>

        <div class="text-center mb-8 flex justify-center items-center gap-4 flex-wrap">
            <button id="up-dir-btn" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-3 px-6 rounded-lg shadow-lg transition-transform transform hover:scale-105 hidden">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 inline-block -mt-1 mr-2" viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M10.707 4.293a1 1 0 010 1.414L7.414 9H14a1 1 0 110 2H7.414l3.293 3.293a1 1 0 01-1.414 1.414l-5-5a1 1 0 010-1.414l5-5a1 1 0 011.414 0z" clip-rule="evenodd" />
                </svg>
                上の階層へ
            </button>
            <button id="copy-path-btn" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-3 px-6 rounded-lg shadow-lg transition-transform transform hover:scale-105 hidden">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 inline-block -mt-1 mr-2" viewBox="0 0 20 20" fill="currentColor">
                  <path d="M8 3a1 1 0 011-1h2a1 1 0 110 2H9a1 1 0 01-1-1z" />
                  <path d="M6 3a2 2 0 00-2 2v11a2 2 0 002 2h8a2 2 0 002-2V5a2 2 0 00-2-2 3 3 0 01-3 3H9a3 3 0 01-3-3z" />
                </svg>
                パスをコピー
            </button>
            <h2 id="current-dir-name" class="text-xl text-gray-400 font-semibold order-first sm:order-none w-full sm:w-auto mb-2 sm:mb-0">フォルダを選択してください</h2>
            <!-- ★変更点: サイズ切り替えボタンを追加 -->
            <button id="toggle-size-btn" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-3 px-6 rounded-lg shadow-lg transition-transform transform hover:scale-105 hidden">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 inline-block -mt-1 mr-2" viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm12 12H4l4-8 3 6 2-4 3 6z" clip-rule="evenodd" />
                </svg>
                サイズ: 中
            </button>
            <button id="select-dir-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg shadow-lg transition-transform transform hover:scale-105">
                ルートフォルダを選択
            </button>
        </div>

        <div id="status-area" class="text-center my-8"></div>

        <div id="item-list" class="grid">
            <!-- ディレクトリや画像がここに表示されます -->
        </div>
    </div>

    <!-- 画像ビューワー -->
    <div id="viewer">
        <div id="viewer-pages">
            <div class="page-container">
                <img id="left-page" src="" alt="Left Page">
            </div>
            <div class="page-container">
                <img id="right-page" src="" alt="Right Page">
            </div>
        </div>
        <div id="viewer-toolbar">
            <button id="prev-btn" class="bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
            </button>
            <button id="toggle-view-btn" class="bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded-lg w-32">単一表示にする</button>
            <button id="adjust-spread-btn" class="bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded-lg">見開き調整</button>
            <span id="page-counter" class="text-lg font-medium text-white w-24 text-center"></span>
            <button id="next-btn" class="bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
            </button>
            <button id="fullscreen-btn" class="bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded-lg">全画面</button>
            <button id="close-viewer-btn" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg">閉じる</button>
        </div>
    </div>

    <script>
        // DOM要素の取得
        const selectDirBtn = document.getElementById('select-dir-btn');
        const itemList = document.getElementById('item-list');
        const statusArea = document.getElementById('status-area');
        const viewer = document.getElementById('viewer');
        const leftPageImg = document.getElementById('left-page');
        const rightPageImg = document.getElementById('right-page');
        const closeViewerBtn = document.getElementById('close-viewer-btn');
        const adjustSpreadBtn = document.getElementById('adjust-spread-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const pageCounter = document.getElementById('page-counter');
        const toggleViewBtn = document.getElementById('toggle-view-btn');
        const viewerToolbar = document.getElementById('viewer-toolbar');
        const upDirBtn = document.getElementById('up-dir-btn');
        const currentDirName = document.getElementById('current-dir-name');
        const copyPathBtn = document.getElementById('copy-path-btn');
        const toggleSizeBtn = document.getElementById('toggle-size-btn'); // ★追加

        // グローバル変数
        let directoryHistory = [];
        let currentImageFiles = [];
        let currentImageIndex = 0;
        let pageOffset = 0;
        let isSinglePageView = false;
        let toolbarHideTimer = null;
        const imageExtensions = ['.jpg', '.jpeg', '.png', '.gif', '.webp', '.bmp'];
        let createdUrls = new Set();
        let thumbnailSizeIndex = 1; // 0:小, 1:中, 2:大 ★追加
        const sizeOptions = [ // ★追加
            { name: '小', classes: 'grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-7 xl:grid-cols-8 gap-4' },
            { name: '中', classes: 'grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 md:gap-6' },
            { name: '大', classes: 'grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6 md:gap-8' }
        ];

        // --- イベントリスナー ---

        selectDirBtn.addEventListener('click', async () => {
            if (!('showDirectoryPicker' in window)) {
                showStatus('お使いのブラウザはこの機能に対応していません。Google ChromeやMicrosoft Edgeの最新版をお試しください。', 'error');
                return;
            }
            try {
                const dirHandle = await window.showDirectoryPicker();
                directoryHistory = [dirHandle];
                await processDirectory(dirHandle);
            } catch (err) {
                if (err.name !== 'AbortError') console.error('ディレクトリ選択エラー:', err);
            }
        });

        upDirBtn.addEventListener('click', async () => {
            if (directoryHistory.length > 1) {
                directoryHistory.pop();
                const parentDirHandle = directoryHistory[directoryHistory.length - 1];
                await processDirectory(parentDirHandle);
            }
        });

        copyPathBtn.addEventListener('click', () => {
            if (directoryHistory.length > 0) {
                // セキュリティ上の理由から、ブラウザは絶対パスへのアクセスを許可しません。
                // そのため、ルートとして選択したフォルダからの相対パスをコピーします。
                const path = directoryHistory.map(handle => handle.name).join('/');
                navigator.clipboard.writeText(path)
                    .then(() => {
                        showStatus('パスをクリップボードにコピーしました。', 'info');
                        setTimeout(() => showStatus('', 'clear'), 2000);
                    })
                    .catch(err => {
                        console.error('パスのコピーに失敗:', err);
                        showStatus('パスのコピーに失敗しました。', 'error');
                    });
            }
        });

        // ★追加: サイズ切り替えボタンのイベント
        toggleSizeBtn.addEventListener('click', () => {
            thumbnailSizeIndex = (thumbnailSizeIndex + 1) % sizeOptions.length;
            updateThumbnailSize();
        });

        closeViewerBtn.addEventListener('click', closeViewer);
        toggleViewBtn.addEventListener('click', () => {
            isSinglePageView = !isSinglePageView;
            updateViewModeUI();
            displayPages();
        });
        adjustSpreadBtn.addEventListener('click', () => {
            pageOffset = 1 - pageOffset;
            displayPages();
        });
        nextBtn.addEventListener('click', () => navigatePages(isSinglePageView ? -1 : -2));
        prevBtn.addEventListener('click', () => navigatePages(isSinglePageView ? 1 : 2));
        fullscreenBtn.addEventListener('click', toggleFullscreen);

        document.addEventListener('keydown', (e) => {
            if (e.altKey && e.key === 'ArrowLeft') {
                e.preventDefault();
                if (viewer.style.display !== 'none') {
                    closeViewer();
                } else if (directoryHistory.length > 1) {
                    upDirBtn.click();
                }
                return;
            }

            if (viewer.style.display === 'none') return;
            const step = isSinglePageView ? 1 : 2;
            switch (e.key) {
                case 'ArrowLeft': navigatePages(step); break;
                case 'ArrowRight': navigatePages(-step); break;
                case 'Escape': closeViewer(); break;
            }
        });

        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                viewer.addEventListener('mousemove', resetToolbarTimer);
                resetToolbarTimer();
            } else {
                viewer.removeEventListener('mousemove', resetToolbarTimer);
                clearTimeout(toolbarHideTimer);
                viewerToolbar.classList.remove('hidden');
            }
        });

        // --- メインロジック ---

        async function processDirectory(dirHandle) {
            for (const url of createdUrls) {
                URL.revokeObjectURL(url);
            }
            createdUrls.clear();

            showStatus('<div class="loader mx-auto"></div><p class="mt-2">フォルダを読み込んでいます...</p>', 'loading');
            updateThumbnailSize(); // ★追加: ディレクトリ移動時にサイズを再適用
            itemList.innerHTML = '';
            updateNavigationUI();

            const items = [];
            try {
                for await (const entry of dirHandle.values()) {
                    if (entry.kind === 'directory') {
                        items.push({ type: 'directory', handle: entry, name: entry.name });
                    } else if (entry.kind === 'file' && imageExtensions.some(ext => entry.name.toLowerCase().endsWith(ext))) {
                        items.push({ type: 'image', handle: entry, name: entry.name });
                    }
                }

                items.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));

                if (items.length === 0) {
                    showStatus('表示できるアイテムがありません。', 'info');
                    return;
                }

                showStatus('', 'clear');

                const imageItems = items.filter(item => item.type === 'image');

                items.forEach(item => {
                    const imageIndex = item.type === 'image' ? imageItems.findIndex(imgItem => imgItem.name === item.name) : -1;
                    createItemCard(item, dirHandle, imageIndex);
                });

            } catch (err) {
                console.error('ディレクトリ処理エラー:', err);
                showStatus('フォルダの読み込み中にエラーが発生しました。', 'error');
            }
        }

        function createItemCard(item, parentHandle, imageIndex) {
            const card = document.createElement('div');
            card.className = 'group bg-gray-800 rounded-lg shadow-md overflow-hidden';

            const thumbnailContainer = document.createElement('div');
            thumbnailContainer.className = 'thumbnail-container cursor-pointer';

            // ★変更点: truncateを削除し、flex-wrapを追加
            const title = document.createElement('h3');
            title.className = 'p-3 text-sm font-semibold text-white flex items-start justify-between flex-wrap gap-y-1';

            const titleText = document.createElement('span');
            titleText.textContent = item.name;
            titleText.className = "break-all"; // 単語の途中でも改行を許可

            title.appendChild(titleText);
            card.appendChild(thumbnailContainer);
            card.appendChild(title);
            itemList.appendChild(card);

            if (item.type === 'directory') {
                const badge = document.createElement('span');
                badge.className = 'text-xs bg-gray-600 text-gray-300 px-2 py-1 rounded-full ml-2 self-center';
                badge.textContent = 'フォルダ';
                title.appendChild(badge);

                thumbnailContainer.addEventListener('click', async () => {
                    directoryHistory.push(item.handle);
                    await processDirectory(item.handle);
                });
                title.addEventListener('click', async (e) => {
                    if (e.target === badge) return;
                    directoryHistory.push(item.handle);
                    await processDirectory(item.handle);
                });

                (async () => {
                    let imageForThumbnail = null;
                    const directImages = await getImageFilesFromDirectory(item.handle);
                    if (directImages.length > 0) {
                        imageForThumbnail = directImages[0];
                    } else {
                        const subSubDirs = [];
                        try {
                             for await (const entry of item.handle.values()) {
                                if (entry.kind === 'directory') subSubDirs.push(entry);
                            }
                        } catch (e) { console.error("サブディレクトリの読み込みに失敗", e); }

                        subSubDirs.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));

                        if (subSubDirs.length > 0) {
                            const deepImages = await getImageFilesFromDirectory(subSubDirs[0]);
                            if (deepImages.length > 0) {
                                imageForThumbnail = deepImages[0];
                            }
                        }
                    }

                    if (imageForThumbnail) {
                        const file = await imageForThumbnail.getFile();
                        const thumbnailUrl = URL.createObjectURL(file);
                        createdUrls.add(thumbnailUrl);
                        const img = document.createElement('img');
                        img.src = thumbnailUrl;
                        img.alt = `Thumbnail for ${item.name}`;
                        thumbnailContainer.innerHTML = '';
                        thumbnailContainer.appendChild(img);
                    } else {
                        thumbnailContainer.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-gray-500" viewBox="0 0 20 20" fill="currentColor"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z" /></svg>`;
                    }

                    if (directImages.length > 0) {
                        const readBtn = document.createElement('button');
                        readBtn.className = 'read-button';
                        readBtn.textContent = '開く';
                        readBtn.onclick = (e) => {
                            e.stopPropagation();
                            openViewer(item.handle, 0);
                        };
                        thumbnailContainer.appendChild(readBtn);
                    }
                })();

            } else if (item.type === 'image') {
                card.classList.add('cursor-pointer');
                card.addEventListener('click', () => openViewer(parentHandle, imageIndex));

                (async () => {
                    try {
                        const file = await item.handle.getFile();
                        const thumbnailUrl = URL.createObjectURL(file);
                        createdUrls.add(thumbnailUrl);
                        const img = document.createElement('img');
                        img.src = thumbnailUrl;
                        img.alt = `Thumbnail for ${item.name}`;
                        thumbnailContainer.innerHTML = '';
                        thumbnailContainer.appendChild(img);
                    } catch(e) {
                         console.error(`サムネイル生成失敗: ${item.name}`, e);
                         thumbnailContainer.innerHTML = '<span class="text-xs text-red-400">読込失敗</span>';
                    }
                })();
            }
        }

        async function getImageFilesFromDirectory(dirHandle) {
            const imageFiles = [];
            try {
                for await (const entry of dirHandle.values()) {
                    if (entry.kind === 'file' && imageExtensions.some(ext => entry.name.toLowerCase().endsWith(ext))) {
                        imageFiles.push(entry);
                    }
                }
                imageFiles.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
            } catch (e) {
                console.error(`ディレクトリ内の画像取得エラー (${dirHandle.name}):`, e);
            }
            return imageFiles;
        }

        async function openViewer(dirHandle, startIndex) {
            try {
                showStatus('<div class="loader mx-auto"></div><p class="mt-2">画像を読み込んでいます...</p>', 'loading');

                currentImageFiles = await getImageFilesFromDirectory(dirHandle);

                if (currentImageFiles.length === 0) {
                    showStatus('このフォルダには表示できる画像がありません。', 'info');
                    return;
                }

                currentImageIndex = startIndex;
                pageOffset = 0;
                isSinglePageView = false;

                viewer.style.display = 'flex';
                document.body.style.overflow = 'hidden';

                updateViewModeUI();
                displayPages();
                showStatus('', 'clear');

            } catch (err) {
                console.error('ビューワー起動エラー:', err);
                showStatus('画像の読み込みに失敗しました。', 'error');
                closeViewer();
            }
        }

        // --- UI更新 & ビューワー関連のヘルパー関数 ---

        function closeViewer() {
            viewer.style.display = 'none';
            document.body.style.overflow = 'auto';
            if (leftPageImg.dataset.url) {
                URL.revokeObjectURL(leftPageImg.dataset.url);
                createdUrls.delete(leftPageImg.dataset.url);
            }
            if (rightPageImg.dataset.url) {
                URL.revokeObjectURL(rightPageImg.dataset.url);
                createdUrls.delete(rightPageImg.dataset.url);
            }
            leftPageImg.src = '';
            rightPageImg.src = '';
            leftPageImg.dataset.url = '';
            rightPageImg.dataset.url = '';
            currentImageFiles = [];
            if (document.fullscreenElement) document.exitFullscreen();
        }

        function updateViewModeUI() {
            if (isSinglePageView) {
                toggleViewBtn.textContent = '見開きに戻す';
                adjustSpreadBtn.style.display = 'none';
            } else {
                toggleViewBtn.textContent = '単一表示にする';
                adjustSpreadBtn.style.display = 'inline-block';
            }
        }

        async function displayPages() {
            const leftContainer = leftPageImg.parentElement;
            const rightContainer = rightPageImg.parentElement;
            const total = currentImageFiles.length;

            if (isSinglePageView) {
                leftContainer.style.display = 'none';
                rightContainer.style.width = '100%';
                await displayImage(rightPageImg, currentImageIndex);
                await displayImage(leftPageImg, -1);
                pageCounter.textContent = `${currentImageIndex + 1} / ${total}`;
            } else {
                leftContainer.style.display = 'block';
                rightContainer.style.width = '50%';
                let baseIndex = currentImageIndex;
                if (baseIndex % 2 !== 0 && baseIndex > 0) baseIndex--;

                const rightPageIndex = baseIndex - pageOffset;
                const leftPageIndex = baseIndex + 1 - pageOffset;

                await displayImage(rightPageImg, rightPageIndex);
                await displayImage(leftPageImg, leftPageIndex);

                const rightPageNum = rightPageIndex >= 0 && rightPageIndex < total ? rightPageIndex + 1 : '-';
                const leftPageNum = leftPageIndex >= 0 && leftPageIndex < total ? leftPageIndex + 1 : '-';
                pageCounter.textContent = `${leftPageNum} - ${rightPageNum} / ${total}`;
            }
        }

        async function displayImage(imgElement, index) {
            if (imgElement.dataset.url) {
                URL.revokeObjectURL(imgElement.dataset.url);
                createdUrls.delete(imgElement.dataset.url);
                imgElement.dataset.url = '';
            }
            if (index >= 0 && index < currentImageFiles.length) {
                try {
                    const file = await currentImageFiles[index].getFile();
                    const url = URL.createObjectURL(file);
                    createdUrls.add(url);
                    imgElement.src = url;
                    imgElement.dataset.url = url;
                    imgElement.style.visibility = 'visible';
                } catch (err) {
                    console.error(`画像表示エラー (index: ${index}):`, err);
                    imgElement.src = '';
                    imgElement.style.visibility = 'hidden';
                }
            } else {
                imgElement.src = '';
                imgElement.style.visibility = 'hidden';
            }
        }

        function navigatePages(direction) {
            let newIndex = currentImageIndex + direction;
            if (newIndex >= currentImageFiles.length) newIndex = currentImageFiles.length - 1;
            if (newIndex < 0) newIndex = 0;
            if (newIndex !== currentImageIndex) {
                currentImageIndex = newIndex;
                displayPages();
            }
        }

        function showStatus(message, type) {
            statusArea.innerHTML = message;
            statusArea.className = 'text-center my-8 p-4 rounded-lg ';
            switch (type) {
                case 'info': statusArea.classList.add('bg-blue-900', 'text-blue-200'); break;
                case 'error': statusArea.classList.add('bg-red-900', 'text-red-200'); break;
                case 'loading': statusArea.classList.add('text-gray-300'); break;
                case 'clear': statusArea.innerHTML = ''; statusArea.className = ''; break;
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.error(err));
            } else {
                document.exitFullscreen();
            }
        }

        function resetToolbarTimer() {
            clearTimeout(toolbarHideTimer);
            viewerToolbar.classList.remove('hidden');
            toolbarHideTimer = setTimeout(() => viewerToolbar.classList.add('hidden'), 2000);
        }

        function updateNavigationUI() {
            const isNotRoot = directoryHistory.length > 1;
            upDirBtn.classList.toggle('hidden', !isNotRoot);
            const hasHistory = directoryHistory.length > 0;
            copyPathBtn.classList.toggle('hidden', !hasHistory);
            toggleSizeBtn.classList.toggle('hidden', !hasHistory); // ★追加

            if (hasHistory) {
                currentDirName.textContent = directoryHistory[directoryHistory.length - 1].name;
            } else {
                currentDirName.textContent = 'フォルダを選択してください';
            }
        }

        // ★追加: サムネイルサイズを更新する関数
        function updateThumbnailSize() {
            const size = sizeOptions[thumbnailSizeIndex];
            // `grid`クラスは常に保持し、サイズ関連のクラスのみを置き換える
            itemList.className = 'grid ' + size.classes;
            const svgIcon = toggleSizeBtn.querySelector('svg').outerHTML;
            toggleSizeBtn.innerHTML = `${svgIcon} サイズ: ${size.name}`;
        }
    </script>
</body>
</html>
